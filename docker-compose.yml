services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akim-astana-simulator
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-}
      - VITE_ENABLE_EXPERIMENTS=${VITE_ENABLE_EXPERIMENTS:-false}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
